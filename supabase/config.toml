project_id = "kopru"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Kayıt yalnızca abone/misafir açma akışlarından yapılır; açık kayıt kapalı.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

# ============================================================ Edge Functions
# `login` OTURUMSUZ çağrılır: kullanıcı henüz giriş yapmamıştır. Platformun
# `verify_jwt` kontrolü yalnız LEGACY (JWT tabanlı) anahtarları anlar; yeni
# publishable anahtar JWT değildir ve supabase-js onu `Authorization: Bearer`
# yerine yalnız `apikey` başlığına koyar. Kontrol açık kalsaydı publishable
# anahtara geçtiğimiz an giriş 401 ile düşerdi.
#
# Güvenlik kaybı yok: fonksiyon yetkilendirmeyi ZATEN kendi yapıyor —
# kullanıcı arama, sponsor VKN doğrulama ve kilit sayacı (kilitli kural 3).
[functions.login]
verify_jwt = false

# Davet kabulü de oturumsuzdur; zaten kapalıydı, açıkça yazılıyor.
[functions.accept-invitation]
verify_jwt = false
